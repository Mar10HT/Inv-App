name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: this is the first time lint has ever been
      # configured/run on this codebase, and it surfaced a pre-existing
      # backlog of ~270 findings (mostly @typescript-eslint/no-explicit-any).
      # Flip to blocking once that backlog is cleaned up.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build (production)
        run: npm run build:prod
