name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Translations
        run: npm run i18n:check

      - name: Icons
        run: npm run icons:check

      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Build (production)
        run: npm run build:prod
